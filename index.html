<!doctype html>
<html lang="en" data-theme="light" data-accent="lamp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Luma Reader</title>
  <meta name="description" content="A calm PDF reader with instant definitions, highlights and notes that sync between your phone and laptop.">
  <meta name="theme-color" content="#F5F6F8">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Luma">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&family=Lexend:wght@300..500&display=swap">

  <link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/reader.css">
  <link rel="modulepreload" href="js/main.js">
</head>
<body>
  <div id="app" class="app">
    <div class="boot" aria-label="Loading Luma Reader"><span class="brand-mark"></span></div>
  </div>
  <input id="file-input" type="file" accept="application/pdf,.pdf" multiple hidden>
  <noscript><p style="padding:2rem">Luma Reader needs JavaScript to run.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
