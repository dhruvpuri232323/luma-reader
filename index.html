<!doctype html>
<html lang="en" data-theme="light" data-accent="lamp">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Luma Reader</title>
  <meta name="description" content="A calm PDF reader with instant definitions, highlights and notes that sync between your phone and laptop.">
  <meta name="theme-color" content="#F5F6F8">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Luma">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&family=Lexend:wght@300..500&family=EB+Garamond:ital,wght@0,400..600;1,400&display=swap">

  <link rel="stylesheet" href="vendor/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/reader.css">
  <link rel="modulepreload" href="js/main.js">
</head>
<body>
  <div id="app" class="app">
    <div class="boot" aria-label="Loading Luma Reader"><span class="brand-mark"></span></div>
  </div>
  <input id="file-input" type="file" accept=".pdf,.epub,.txt,.md,.markdown,.html,.htm,application/pdf,application/epub+zip,text/plain,text/markdown,text/html" multiple hidden>
  <noscript><p style="padding:2rem">Luma Reader needs JavaScript to run.</p></noscript>
  <script>
    // If starting up stalls, say why and offer a way out instead of a silent logo.
    (function () {
      var root = document.documentElement;
      function note(text, actions) {
        var boot = document.querySelector(".boot");
        if (!boot || root.classList.contains("ready")) return;
        var p = boot.querySelector(".boot-note") || boot.appendChild(document.createElement("p"));
        p.className = "boot-note";
        p.textContent = text;
        var old = boot.querySelector(".boot-actions");
        if (old) old.remove();
        if (!actions) return;
        var row = boot.appendChild(document.createElement("div"));
        row.className = "boot-actions";
        var reload = row.appendChild(document.createElement("button"));
        reload.className = "primary";
        reload.textContent = "Reload";
        reload.onclick = function () { location.reload(); };
        var repair = row.appendChild(document.createElement("button"));
        repair.textContent = "Repair app files";
        repair.title = "Re-downloads the app. Your books, notes and words are kept.";
        repair.onclick = async function () {
          repair.disabled = true;
          try {
            var regs = (await navigator.serviceWorker?.getRegistrations?.()) || [];
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
            var keys = (await window.caches?.keys?.()) || [];
            await Promise.all(keys.filter(function (k) { return k.indexOf("luma-share") < 0; }).map(function (k) { return caches.delete(k); }));
          } catch (e) {}
          location.reload();
        };
      }
      addEventListener("luma-db-blocked", function () {
        note("Finishing an update… Close any other Luma Reader windows or browser tabs and it will carry on by itself.");
      });
      setTimeout(function () {
        note("Luma Reader is taking longer than usual to start. If it's open in another window or tab, close that one. Otherwise, reload.", true);
      }, 12000);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
